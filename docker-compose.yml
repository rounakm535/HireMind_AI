version: '3.8'

services:
  # -----------------------------------------------------------------
  # FastAPI Backend Service
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiremind_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=HireMind AI
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://hiremind_user:hiremind_password@postgres:5432/hiremind_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_gemini_api_key}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_hiremind_ai_2026}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:-super_secret_refresh_jwt_key_hiremind_ai_2026}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  # -----------------------------------------------------------------
  # React Vite Frontend Service (Nginx Web Server)
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiremind_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

  # -----------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hiremind_postgres
    restart: always
    environment:
      POSTGRES_USER: hiremind_user
      POSTGRES_PASSWORD: hiremind_password
      POSTGRES_DB: hiremind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiremind_user -d hiremind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # Redis Cache
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hiremind_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -----------------------------------------------------------------
  # Qdrant Vector Search Database
  # -----------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hiremind_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
